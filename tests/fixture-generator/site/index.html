<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Upload action fixture</title></head>
<body>
<header><nav aria-label="Main"><a href="/">Home</a> <a href="/about.html">About</a></nav></header>
<main>
  <h1>Sign up</h1>
  <form id="signup" onsubmit="event.preventDefault(); document.getElementById('done').hidden = false;">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="plan">Plan</label>
    <select id="plan" name="plan"><option>Free</option><option>Team</option></select>
    <button type="submit">Create account</button>
  </form>
  <p id="done" hidden>Thanks!</p>
</main>
</body></html>
