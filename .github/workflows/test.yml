name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
  # Runs the action from this checkout against a dev workspace.
  # Needs the TESTMAP_DEV_TOKEN secret, TESTMAP_DEV_URL / TESTMAP_DEV_PROJECT variables
  # and report fixtures in tests/fixtures/. Skipped until TESTMAP_DEV_URL is set.
  live:
    if: github.event_name == 'push' && vars.TESTMAP_DEV_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: upload
        uses: ./
        with:
          url: ${{ vars.TESTMAP_DEV_URL }}
          token: ${{ secrets.TESTMAP_DEV_TOKEN }}
          project: ${{ vars.TESTMAP_DEV_PROJECT }}
          path: tests/fixtures
          if-no-files-found: error
      - run: echo "Created ${{ steps.upload.outputs.testrun-url }}"
